        <a class="logo-link" href="index.html"><img class="logo" src="images/logo.jpg"></a>
        <a href="" class="btn-choco-jour">CHOCO DU JOUR</a>
        <script>
            const dateDebut = new Date('2025-12-23T03:00:00');
            const dateAujrd = new Date();

            const deltaDate = Math.floor((dateAujrd - dateDebut) / (24 * 60 * 60 * 1000));

            document.querySelector('.btn-choco-jour').href = `card.html?j=${deltaDate}`;
        </script>
    </header>
    <hr>
    <main>
